[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repopilot"
version = "0.3.0"
description = "A terminal coding agent for real Git repositories"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "openai",
  "python-dotenv",
  "pydantic",
  "rich",
  "prompt-toolkit>=3.0.43,<4",
]

[project.scripts]
repopilot = "repopilot.cli.app:main"

[tool.setuptools.packages.find]
include = ["repopilot*"]

[tool.setuptools.package-data]
"repopilot.cli" = ["assets/*.svg", "assets/*.png"]
